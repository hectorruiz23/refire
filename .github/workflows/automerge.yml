name: pr

# Fusiona sola la PR cuando «tests» está verde (squash) y borra su rama.
#
# Por qué no se usa el automerge de GitHub: quien fusiona entonces es el token de
# Actions, y GitHub no encadena eventos de sus propias acciones, así que ni el
# `delete_branch_on_merge` del repo ni un workflow con `pull_request: closed` llegaban
# a correr (PR #1, #2 y #3 dejaron su rama viva). Aquí se espera a los checks y se
# fusiona en el mismo trabajo, con `--delete-branch`.
#
# Consecuencia asumida: el merge lo firma github-actions y no habrá run de «tests» en
# main tras el merge; los tests ya corrieron sobre la PR (GitHub los lanza contra el
# merge con la base). Para frenar una PR, ponle la etiqueta `no-automerge`.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  fusionar:
    if: >-
      github.event.pull_request.draft == false
      && github.event.pull_request.head.repo.full_name == github.repository
      && !contains(github.event.pull_request.labels.*.name, 'no-automerge')
    runs-on: ubuntu-latest
    steps:
      - name: Salir si la PR ya no está abierta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.html_url }}
        run: |
          estado=$(gh pr view "$PR" --json state --jq .state)
          echo "estado: $estado"
          [ "$estado" = "OPEN" ] || exit 0

      # Ojo: hay que mirar SOLO los checks requeridos. Con --watch a secas el trabajo se
      # espera a sí mismo (su propio check está en la lista) y la PR no se fusiona nunca.
      - name: Esperar a que aparezca el check requerido
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.html_url }}
        run: |
          for i in $(seq 1 30); do
            n=$(gh pr checks "$PR" --required --json name --jq 'length' 2>/dev/null || echo 0)
            [ "$n" -gt 0 ] && { echo "requeridos: $n"; break; }
            sleep 5
          done

      - name: Esperar a «tests» (falla si algo se pone rojo)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.html_url }}
        run: gh pr checks "$PR" --required --watch --fail-fast --interval 15

      - name: Fusionar (squash) y borrar la rama
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --squash --delete-branch "$PR"
